<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <script src="/js/script.js" defer></script>
</head>

<body>
    <main class="main-container">
        <div id="qr-title">
            <h1>Gerador de QR Code</h1>
            <p>Digite seu código ou texto para gerar seu código QR</p>
        </div>
        <div id="qr-form">
            <input type="text" id="qr-input" placeholder="Digite aqui sua URL ou texto...">
            <button id="qr-button">Gerar QR Code</button>
        </div>
        <div id="qr-code">
            <img src="/img/qrcode.png" alt="QR code">
        </div>
    </main>
    <footer><p>Lucas Fierce Dev &copy; 2026</p></footer>
</body>

</html>
